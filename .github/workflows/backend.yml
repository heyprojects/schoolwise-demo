name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "SchoolWise.sln"
      - "**/*.csproj"
      - "src/SchoolWise.Api/Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "SchoolWise.sln"
      - "**/*.csproj"
      - "src/SchoolWise.Api/Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore SchoolWise.sln
      - name: Build
        run: dotnet build SchoolWise.sln --configuration Release --no-restore
      - name: Test
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: "1"
        run: dotnet test SchoolWise.sln --configuration Release --no-build --logger trx --results-directory "${{ runner.temp }}/test-results"
      - name: Publish API
        run: dotnet publish src/SchoolWise.Api/SchoolWise.Api.csproj --configuration Release --no-restore --output "${{ runner.temp }}/schoolwise-api"
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolwise-api
          path: ${{ runner.temp }}/schoolwise-api
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
