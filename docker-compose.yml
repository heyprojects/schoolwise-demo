services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolwise
      POSTGRES_USER: ${POSTGRES_USER:-schoolwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - schoolwise-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: schoolwise-api:local
    build:
      context: .
      dockerfile: src/SchoolWise.Api/Dockerfile
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=schoolwise;Username=${POSTGRES_USER:-schoolwise};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      Jwt__Issuer: ${JWT_ISSUER:-SchoolWise}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolWise.Web}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: schoolwise-api:local
    build:
      context: .
      dockerfile: src/SchoolWise.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=schoolwise;Username=${POSTGRES_USER:-schoolwise};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      Jwt__Issuer: ${JWT_ISSUER:-SchoolWise}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolWise.Web}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@schoolwise.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env file}
      Frontend__Origins: ${FRONTEND_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  schoolwise-postgres-data:
